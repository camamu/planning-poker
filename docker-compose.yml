services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/planningpoker
      - PORT=3000
      - NODE_ENV=development
      - CORS_ORIGIN=http://localhost:5173
      - LOG_LEVEL=info
      - SESSION_SECRET=dev-secret-change-me
      # Panel /admin en local: usuario `admin`, contraseña `admin-dev-change-me`.
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD_HASH=scrypt:njzt-OMxbpShy0fg6Cp_Tw:Vj4gWxw5YMNzjGoltMXKEwI5oOcaZT9hsAooMXY2-2-BW_00ZgpwkSQJTVGAwtPa0MMDqnUkDaxtFTPuED6B2A
    ports: ['3000:3000']
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./apps/api/src:/app/apps/api/src

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      - VITE_API_URL=http://localhost:3000
      - VITE_WS_URL=http://localhost:3000
    ports: ['5173:5173']
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: planningpoker
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
    volumes: [pgdata:/var/lib/postgresql/data]

volumes:
  pgdata:
