services:
  api:
    image: ghcr.io/camamu/planning-poker/api:${IMAGE_TAG:-latest}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=3000
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SESSION_SECRET=${SESSION_SECRET}
    expose: ['3000']
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  web:
    image: ghcr.io/camamu/planning-poker/web:${IMAGE_TAG:-latest}
    environment:
      - VITE_API_URL=${PUBLIC_API_URL}
      - VITE_WS_URL=${PUBLIC_API_URL}
    expose: ['5173']
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: planningpoker
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

volumes:
  pgdata:
