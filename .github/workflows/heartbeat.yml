name: Supabase heartbeat

on:
  schedule:
    # Diario, a una hora suelta y no en punto, para no competir con el resto de crons de GitHub.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Consulta trivial contra Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Instalar psql si el runner no lo trae
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      # El free tier de Supabase pausa el proyecto tras 7 días sin peticiones y el equipo se reúne
      # cada dos semanas: sin esto, la BD estaría dormida en cada sprint.
      - name: Resetear el contador de inactividad
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        # sslmode=no-verify es un alias del driver `pg` de Node (docs/06-despliegue.md §3.3), no del
        # libpq real que usa psql — ahí solo valen disable/allow/prefer/require/verify-ca/verify-full.
        # `require` en libpq ya cifra sin verificar el certificado, que es el mismo efecto que
        # buscábamos con no-verify, así que se sustituye solo para esta invocación.
        run: psql "${DATABASE_URL/sslmode=no-verify/sslmode=require}" -c 'select 1;'
