name: Publish images

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag de la release a publicar (ej. v1.0.1)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release a publicar (ej. v1.0.1)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
      # docker/metadata-action deriva las tags del contexto del evento (github.ref), que al
      # invocarse como workflow_call desde release.yml sigue apuntando a `main`, no al tag de la
      # release recién creada — por eso las tags se calculan a mano a partir del input `tag`, y
      # meta-action se deja solo para las labels OCI (esas sí valen con github.sha/repository).
      - name: Calcular tags de la imagen
        id: vars
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ steps.vars.outputs.version }}
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ steps.vars.outputs.minor }}
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ inputs.tag }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
