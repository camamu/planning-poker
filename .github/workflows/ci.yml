name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: '10'

jobs:
  quality:
    name: Lint · Tipos · Arquitectura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Barrera arquitectónica
        run: pnpm arch

  unit:
    name: Tests de dominio y casos de uso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pp/api test:unit -- --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-domain
          path: apps/api/coverage

  contract:
    name: Tests de contrato (Postgres real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planningpoker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/planningpoker_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pp/api migrate:up
      - run: pnpm --filter @pp/api test:contract

  e2e:
    name: E2E sobre el stack real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
      - name: Esperar a que la API esté lista
        run: timeout 90s bash -c 'until curl -sf localhost:3000/ready; do sleep 2; done'
      - run: docker compose exec -T api pnpm test:e2e
      - name: Logs si falla
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  docker-build:
    name: Build de imágenes (sin publicar)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: production
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  smoke-test-api:
    name: Smoke test (imagen production API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planningpoker_smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          load: true
          tags: pp-api:smoke
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Arrancar el contenedor de producción
        # --network host: el contenedor necesita alcanzar el Postgres de servicio,
        # publicado en localhost del runner, no en una red docker propia.
        run: |
          docker run -d --name pp-api-smoke --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/planningpoker_smoke \
            -e PORT=3000 \
            -e CORS_ORIGIN=http://localhost:5173 \
            -e SESSION_SECRET=smoke-test-secret \
            pp-api:smoke
      - name: Esperar a que /health responda
        run: timeout 30s bash -c 'until curl -sf localhost:3000/health; do sleep 1; done'
      - name: Logs si falla
        if: failure()
        run: docker logs pp-api-smoke
      - if: always()
        run: docker rm -f pp-api-smoke

  smoke-test-web:
    name: Smoke test (imagen production front)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: production
          load: true
          tags: pp-web:smoke
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Arrancar el contenedor de producción
        run: docker run -d --name pp-web-smoke -p 5173:5173 pp-web:smoke
      - name: Esperar a que la home responda
        run: timeout 30s bash -c 'until curl -sf localhost:5173/; do sleep 1; done'
      - name: Logs si falla
        if: failure()
        run: docker logs pp-web-smoke
      - if: always()
        run: docker rm -f pp-web-smoke
